[package]
name = "rsnetstat"
version = "0.2.0"
edition = "2024"
description = "High-fidelity, CIDR-complete alternative to macOS netstat -rn"
license = "Apache-2.0"
repository = "https://github.com/sparkworx/rsnetstat"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
